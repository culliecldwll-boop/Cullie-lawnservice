<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Cullie Lawn Service for a quote or questions about our professional lawn care services.">
    <title>Contact Us - Cullie Lawn Service</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        function validateForm(event) {
            event.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();
            
            let isValid = true;
            
            // Clear previous error messages
            document.querySelectorAll('.error-message').forEach(el => el.remove());
            document.querySelectorAll('input.error, textarea.error').forEach(el => el.classList.remove('error'));
            
            if (!name) {
                showError('name', 'Please enter your name');
                isValid = false;
            }
            
            if (!email) {
                showError('email', 'Please enter your email');
                isValid = false;
            } else if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
                showError('email', 'Please enter a valid email address');
                isValid = false;
            }
            
            if (!message) {
                showError('message', 'Please enter a message');
                isValid = false;
            } else if (message.length < 10) {
                showError('message', 'Message should be at least 10 characters');
                isValid = false;
            }
            
            if (isValid) {
                alert('Thank you for contacting us! We will get back to you within 24 hours.');
                document.getElementById('contactForm').reset();
            }
            
            return false;
        }
        
        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            field.classList.add('error');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            field.parentNode.insertBefore(errorDiv, field.nextSibling);
        }
    </script>
</head>
<body>
<header role="banner">
    <div class="logo-bar">
        <img src="logo.header.png" alt="Cullie Lawn Service Logo">
    </div>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="pricing.html">Pricing</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html" aria-current="page">Contact</a>
    </nav>
</header>

<main role="main">
<div class="section">
  <h2>Contact Us</h2>

  <p>Have questions or want to schedule service? Send us a message below and we'll respond within 24 hours.</p>

  <form id="contactForm" onsubmit="validateForm(event)" novalidate>
    <div>
      <label for="name">Name <span aria-label="required">*</span></label>
      <input id="name" type="text" placeholder="Your full name" required>
    </div>

    <div>
      <label for="email">Email <span aria-label="required">*</span></label>
      <input id="email" type="email" placeholder="your.email@example.com" required>
    </div>

    <div>
      <label for="phone">Phone (Optional)</label>
      <input id="phone" type="tel" placeholder="(555) 123-4567">
    </div>

    <div>
      <label for="message">Message <span aria-label="required">*</span></label>
      <textarea id="message" rows="6" placeholder="Tell us about your lawn care needs..." required></textarea>
    </div>

    <button type="submit">Send Message</button>
  </form>
</div>
</main>

<footer role="contentinfo">
    <p>&copy; 2024 Cullie Lawn Service. All rights reserved.</p>
    <p>Serving Spartanburg, SC | Professional Lawn Care</p>
    <p>
        <a href="contact.html">Contact Us</a> | 
        <a href="about.html">About</a> | 
        <a href="services.html">Services</a>
    </p>
</footer>
</body>
</html>
